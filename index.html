<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ششم شهید آرمات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#16223f;--line:#d9e0ee;--brand:#1d3a8a;--brand-ink:#fff;--accent:#f2b705;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#e8ecf8;--line:#2a3558;--brand:#2b4aa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#e8ecf8;--line:#2a3558;--brand:#2b4aa8;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;line-height:1.8;min-height:100%}
header{background:var(--brand);color:var(--brand-ink);padding:28px 20px 22px;border-bottom:6px solid var(--accent)}
.wrap{max-width:760px;margin:0 auto}
h1{margin:0;font-size:clamp(28px,7vw,44px);font-weight:800;line-height:1.3}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}
nav button{flex:none;font:inherit;font-size:15px;font-weight:600;padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.day{font:inherit;font-size:18px;font-weight:600;padding:12px 22px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
main{padding:20px 16px 48px}
:root{--ok:#1f8a4c;--okbg:#e2f4e9;--bad:#c23b3b;--badbg:#fbe4e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#5fd493;--okbg:#14382a;--bad:#ff8a8a;--badbg:#401c1c}}
:root[data-theme="dark"]{--ok:#5fd493;--okbg:#14382a;--bad:#ff8a8a;--badbg:#401c1c}
.sum{display:flex;gap:10px;margin-bottom:14px}
.sum div{flex:1;border-radius:10px;padding:8px 12px;font-weight:600}
.sum .p{background:var(--okbg);color:var(--ok)}
.sum .a{background:var(--badbg);color:var(--bad)}
.st{display:flex;align-items:center;justify-content:space-between;width:100%;font:inherit;text-align:right;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;margin-bottom:8px}
.st .tag{font-size:13px;font-weight:600;padding:1px 12px;border-radius:999px;background:var(--okbg);color:var(--ok)}
.st.abs{background:var(--badbg)}
.st.abs .tag{background:var(--bad);color:#fff}
.box ol{margin:0;padding-inline-start:26px}
.lnk{display:block;text-decoration:none;font-size:18px;font-weight:600;padding:14px 20px;border-radius:12px;background:var(--brand);color:var(--brand-ink);margin-bottom:10px}
.lnk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.lnk{width:100%;border:0;font:inherit;font-size:18px;font-weight:600;text-align:right;cursor:pointer}
.qa b{display:block;margin-bottom:4px}
.wl div{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.wl div:last-child{border-bottom:0}
.wl b{flex:none;min-width:110px}
.sec{font-size:20px;margin:22px 0 10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.box p{margin:0}
.note{border-inline-start:6px solid var(--accent)}
.box h2{font-size:19px;margin:0 0 8px}
.box ul{margin:0;padding-inline-start:22px}
.sup{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;border:3px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:20;text-decoration:none}
.sup svg{width:28px;height:28px}
.tm{display:block;font-size:15px;font-weight:600;opacity:.8;margin-top:2px}
</style>
</head>
<body>
<header><div class="wrap"><h1>ششم شهید آرمات</h1></div></header>
<nav><div class="wrap" role="tablist" id="tabs"></div></nav>
<main><div class="wrap" id="content"></div></main>
<script>
const TABS=[["today","اتفاقات امروز"],["students","غایبین"],["supplies","تدارکات"],["schedule","ساعت آموزش"],["help","رفع اشکال"]];
document.getElementById("tabs").innerHTML=TABS.map(([id,l])=>`<button role="tab" data-id="${id}">${l}</button>`).join("");
const DAY="day-1405-8-19";
const DAY_HTML=`<div class="box"><p>امروز در مدرسه مراسمی به مناسبت بزرگداشت شهید برگزار شد و پیکر مطهر یک شهید گمنام به مدرسه ما آورده شد. همچنین مراسم مداحی و روضه‌خوانی برگزار گردید و از دانش‌آموزان با نذری پذیرایی شد.</p></div><div class="box note"><p><b>توجه:</b> کلاس‌های فردا به‌صورت آنلاین برگزار خواهد شد.</p></div><div class="box"><h2>فعالیت‌های آموزشی امروز</h2><ul><li>درس ریاضی تا پایان صفحه ۳۲ حل و بررسی شد.</li><li>آزمون املا از دانش‌آموزان گرفته شد.</li></ul></div>`;
const STUDENTS=["آدرین هاشمی پور","آرتمن شریفی","آراد نوری نسب","احمدرضا دلدار","ابوالفضل رمضان زاده","امیرحسین میرزایی","امیررضا احمدی","امیر علی جعفری","امیر محمد عظیمی نژاد","اوستا اعتماد","پدرام رحماندوست","حسین دولتی","حسین طاهری","حسام جهانی مقدم","رضا احمدپور","رضا صدری خواه","ستار خرمی نیا","سید آریان سجادی","علی اصغر جراره","علی خاکسار","علی سلیمی","علی محمد سهرابی","محمد بستگانی","محمد پارسا پشنگ","محمد رحماندوست","محمد شریفی","محمد طاها کرانیان","محمد علی محمدی","محمدایلیا بهرامی","محمدطاها جوکار","محمدرضا سهرابی پور","محمدرضا قریشی","محمدرضا موحدی نیا","محمد مهدی مهرانی","مهیار متولی","مهرسام فولادی","یوسف تنیده"];
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const KEY="abs-"+new Date().toISOString().slice(0,10);
const DEF=["محمد طاها کرانیان","ستار خرمی نیا","علی خاکسار","محمد بستگانی","یوسف تنیده","امیر علی جعفری"];
let abs=null;try{abs=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!Array.isArray(abs))abs=KEY==="abs-2026-11-10"?DEF.map(n=>STUDENTS.indexOf(n)).filter(i=>i>=0):[];
function studentsHTML(){return `<div class="sum"><div class="p">حاضر: ${fa(STUDENTS.length-abs.length)}</div><div class="a">غایب: ${fa(abs.length)}</div></div>`+STUDENTS.map((n,i)=>`<button class="st${abs.includes(i)?" abs":""}" data-st="${i}"><span>${fa(i+1)}. ${n}</span><span class="tag">${abs.includes(i)?"غایب":"حاضر"}</span></button>`).join("")}
const SCHEDULE=[["شنبه",["ریاضی","فارسی","علوم"]],["یک‌شنبه",["ریاضی","فارسی","مطالعات اجتماعی","علوم تجربی","هدیه‌های آسمان"]],["دوشنبه",["ریاضی","ورزش","مطالعات و هدیه","علوم","فارسی"]],["سه‌شنبه",["علوم تجربی","ریاضی","فارسی","مطالعات اجتماعی","تفکر و پژوهش"]],["چهارشنبه",["قران کامل","کار و فناوری"]]];
const TIMES=[["۸:۰۰","۱۰:۳۰"],["۷:۳۰","۱۲:۰۰"],["۷:۳۰","۱۲:۰۰"],["۷:۳۰","۱۲:۰۰"],["۸:۰۰","۱۰:۳۰"]];
function scheduleHTML(){return SCHEDULE.map(([d,l],i)=>`<div class="box"><h2>${d}<span class="tm">شروع ${TIMES[i][0]} / پایان ${TIMES[i][1]}</span></h2><ol>${l.map(x=>`<li>${x}</li>`).join("")}</ol></div>`).join("")}
const SCI=[["شهاب‌سنگ را تعریف کنید.","همه اجرامی که در فضا در حال حرکت هستند و به زمین می‌افتند، شهاب‌سنگ نامیده می‌شوند."],["مشاهده چیست؟","استفاده دقیق از حواس که همراه با یادداشت‌برداری و جمع‌آوری اطلاعات است."],["هرچه اندازه‌ی شهاب‌سنگ بزرگ‌تر باشد، گودال ایجادشده .......... خواهد بود.","عمیق‌تر."],["علم چیست؟","علم بخشی از زندگی است. علم همیشه و هر روز با ماست."],["سرعت برخورد شهاب‌سنگ چه اثری روی قطر دهانه‌ی گودال دارد؟","هرچه شهاب‌سنگ با سرعت بیشتری به زمین برخورد کند، قطر دهانه‌ی گودال ایجادشده بزرگ‌تر خواهد بود."],["برخورد ........ به سطح زمین را می‌توان شبیه برخورد یک گلوله‌ی فلزی (تیله) با زمین در نظر گرفت.","شهاب‌سنگ."],["در هر بررسی علمی، تکرار آزمایش سبب چه چیزی می‌شود؟","در هر بررسی علمی، تکرار آزمایش سبب می‌شود تا نتایج درست‌تری کسب شود."],["هنگام برخورد شهاب‌سنگ با زمین چه اتفاقی می‌افتد؟ و چرا قطر و عمق گودال‌های ایجادشده یکسان نیست؟","گودالی عمیق در زمین به وجود می‌آید. چون وزن و اندازه‌ی شهاب‌سنگ‌ها متفاوت است."],["چه آزمایشی خوب است؟","آزمایشی که بتوان آن را با وسایل ساده انجام داد و قابل تکرار باشد."],["چه عواملی بر عمق و قطر گودال‌های ایجادشده در اثر برخورد شهاب‌سنگ مؤثر است؟","اندازه‌ی شهاب‌سنگ، سرعت برخورد شهاب‌سنگ با زمین و جنس خاکی که شهاب‌سنگ در آنجا با زمین برخورد می‌کند."],["آیا در اثر سقوط شهاب‌سنگ به اقیانوس گودال ایجاد می‌شود؟","خیر."],["اندازه‌ی شهاب‌سنگ چه اثری در قطر گودال ایجادشده دارد؟","هرچه اندازه‌ی شهاب‌سنگ بزرگ‌تر باشد، قطر گودال ایجادشده بزرگ‌تر خواهد بود."]];
const SCI2=[["معایب ذخیره‌ی اطلاعات به شیوه‌ی گذشتگان را بیان کنید؟","نوشتن بر روی این مواد دشوار و زمان‌بر بود، جابه‌جایی برخی از آن‌ها دشوار بود و در برخی موارد غیرقابل انتقال بودند. موادی همچون چوب پس از مدتی پوسیده می‌شد و سنگ به مرور زمان بر اثر عوامل طبیعی خرد می‌شد و از بین می‌رفت."],["چرا انسان‌ها برای ثبت و ذخیره‌ی اطلاعات به فکر روش‌های جدیدی افتادند؟","زیرا با گذشت زمان در اثر عوامل گوناگون از جمله افزایش جمعیت کره‌ی زمین، اطلاعات علمی و آثار فرهنگی و اجتماعی زیادی تولید شد که در این وضعیت روش پیشین برای ثبت و ذخیره‌ی اطلاعات کافی نبود."],["قدیمی‌ترین روش برای ثبت و ذخیره‌ی اطلاعات چه بود؟","نقاشی روی دیوار غارها"],["مواد طبیعی چیست؟","به موادی مانند سنگ، پشم، پنبه، پوست و چوب که به طور طبیعی یافت می‌شوند، مواد طبیعی می‌گویند."],["مواد مصنوعی چیست؟","به موادی که به طور طبیعی یافت نمی‌شوند، بلکه آن‌ها را از مواد موجود در طبیعت می‌سازند، مواد مصنوعی گفته می‌شود."],["در چه زمانی و در چه سرزمینی مسلمانان موفق شدند به دانش ساخت کاغذ دست پیدا کنند؟","در حدود ۷۰۰ سال پس از میلاد مسیح، در سرزمینی به نام سمرقند (یکی از شهرهای قدیم ایران که امروزه یکی از شهرهای کشور ازبکستان است)."],["کدام قسمت‌های درخت برای تهیه‌ی کاغذ مناسب است؟","از میان اجزای تشکیل‌دهنده‌ی درخت، فقط ساقه و تنه‌ی محکم و شاخه‌های چوبی درختان تنومند برای تهیه‌ی کاغذ مناسب است."],["در تولید کاغذ از چوب کدام مرحله یک نوع تغییر شیمیایی است؟","تبدیل تکه‌های ریز چوب به خمیر و از بین بردن رنگ آن"],["آب اکسیژنه چه ویژگی‌هایی دارد؟","خاصیت رنگ‌بری دارد ولی رنگ همه‌ی مواد را نمی‌تواند از بین ببرد. باید در جای خنک و تاریک نگهداری شود تا تجزیه نشود."],["هنگام استفاده از آب اکسیژنه باید چه مواردی را رعایت کرد؟","از تماس آب اکسیژنه با پوست پرهیز شود و در فضای بسته استفاده نشود."],["چند ماده که خاصیت رنگ‌بری دارند را نام ببرید؟","آب اکسیژنه، گاز کلر، آب ژاول (سفیدکننده)"],["روش ثبت و نگهداری اطلاعات توسط گذشتگان و نیاکانمان را بنویسید؟","نقاشی روی دیوار غارها و ظرف‌های سفالی و گلی، روی چوب، چرم، سنگ، ورقه‌های مسی و طلا و پارچه‌های ابریشمی"],["چه کاربردهای دیگری از کاغذ در زندگی روزمره‌ی خود سراغ دارید؟","۱. در دستگاه خودپرداز\n۲. قبض آب یا برق\n۳. بسته‌بندی لوازم خانگی و صنعتی\n۴. مقوا برای کاردستی"],["چرا انسان به فکر روش‌های جدید برای ثبت و ذخیره‌ی اطلاعات افتاد؟","چون جمعیت کره‌ی زمین افزایش یافت و اطلاعات در آثار فرهنگی و اجتماعی زیاد شد و روش‌های قدیمی برای ثبت و ذخیره‌ی اطلاعات کافی نبود."],["مسلمانان در چه تاریخی و در کجا به دانش ساخت کاغذ دست یافتند؟","هفتصد سال پس از میلاد مسیح در سمرقند"],["ماده‌ی اصلی و خام مورد نیاز برای ساخت کاغذ چیست؟","چوب"],["در صنعت کاغذسازی چگونه رنگ زرد چوب را از بین می‌برند؟","با افزودن مواد شیمیایی رنگ‌بر مانند کلر یا آب اکسیژنه"],["نام سه ماده‌ی سفیدکننده و رنگ‌بر را بنویسید.","آب اکسیژنه، کلر، آب ژاول یا مایع سفیدکننده"],["مراحل مختلف بازیافت کاغذ را نام ببرید.","جمع‌آوری، بسته‌بندی، پرس کردن، خمیر کردن، افزودن مواد شیمیایی لازم"],["کاغذ یکی از مواد ............ است که کاربرد بسیار گسترده‌ای در زندگی ما دارد.","مصنوعی"]];

ید جمعیت"],["چه قسمت‌هایی از کارخانه کاغذسازی از آهن ساخته شده است؟","۱) دستگاه چوب خردکن\n۲) سرند\n۳) دیگ خمیرسازی\n۴) غلتک‌های مخصوص خشک کردن کاغذ"],["چه نوع مواد و وسایلی در کارخانه کاغذسازی به کار رفته است؟","اره، رنده، غلتک، سرند، دستگاه چوب خردکن، دیگ خمیرسازی"],["چهار ویژگی آهن را نام ببرید.","۱) به فراوانی یافت می‌شود.\n۲) از مواد مهم تشکیل‌دهنده زمین است.\n۳) سخت و محکم است.\n۴) در رطوبت و هوای آزاد سریع زنگ می‌زند."],["کدام ویژگی‌های آهن سبب شده تا این فلز به طور رسمی در اغلب صنایع بزرگ کاربرد داشته باشد؟","فراوان بودن آن، هزینه استخراج آن از سایر فلزات کمتر است، سخت و محکم است."],["چهار ویژگی مشترک فلزات را بنویسید.","۱) رسانای خوبی برای جریان برق هستند.\n۲) سطح تازه بریده آن‌ها براق است.\n۳) با ضربه نمی‌شکنند.\n۴) به صورت ورقه و مفتول در می‌آیند."]];

const SOC=[["درس اول: دوستی",[["چرا انسان نمی‌تواند تنها زندگی کند؟","زیرا انسان موجودی اجتماعی است و تنهایی برای او احساس ناخوشایندی دارد."],["چرا ما به دوست نیاز داریم؟","برای اینکه به دوستانمان محبت کنیم و مورد محبت و مهربانی دیگران قرار بگیریم."],["چهار مورد از فایده‌های دوست خوب را بنویسید.","۱- لذت بردن از همنشینی و همفکری با او\n۲- صحبت کردن با دوست عاقل و صبور\n۳- یاری رساندن به ما هنگام مشکلات\n۴- افزایش آگاهی و یادگیری چیزهای جدید"],["چرا انتخاب دوست موضوع مهمی است؟","زیرا رفتار و اخلاق دوستان در ما تأثیر می‌گذارد و ما نیز بر دوستانمان تأثیر می‌گذاریم."],["چرا باید در انتخاب دوست دقت کنیم؟","زیرا دوست خوب باعث پیشرفت ما می‌شود و دوست بد ممکن است ما را به کارهای نادرست بکشاند."],["ویژگی‌های یک دوست خوب چیست؟","عاقل، صبور، راستگو، مهربان، درستکار و باایمان باشد."],["از نظر پیامبر اکرم (ص) بدترین افراد چه کسانی هستند؟","کسانی که میان مردم سخن‌چینی می‌کنند و بین دوستان جدایی می‌اندازند."],["منظور از بیت «تو اول بگو با کیان زیستی، من آن گه بگویم که تو کیستی» چیست؟","برای شناخت شخصیت یک فرد باید به دوستان و همنشینان او توجه کنیم."]]],["درس دوم: آداب دوستی",[["دو مورد از آداب دوستی را نام ببرید.","احترام گذاشتن به دوستان و حفظ اسرار آن‌ها."],["برای حفظ دوستی چه کارهایی باید انجام دهیم؟","به دوستانمان احترام بگذاریم، با آن‌ها مهربان باشیم، به حرف‌هایشان گوش دهیم و از اشتباهاتشان بگذریم."],["در دوستی باید به چه نکاتی توجه کنیم؟","از مسخره کردن، تحقیر کردن، دروغ گفتن و تمسخر دوستان خودداری کنیم."],["اگر دوستمان اشتباهی کرد چه باید بکنیم؟","با مهربانی و احترام اشتباهش را به او تذکر دهیم."],["چرا باید رازدار باشیم؟","زیرا رازدار بودن باعث جلب اعتماد دوستان می‌شود."],["با چه کسانی نباید دوستی کنیم؟","با افراد دروغگو، سخن‌چین و بدرفتار."],["چرا باید از مسخره کردن دوستان خودداری کنیم؟","زیرا باعث ناراحتی و از بین رفتن دوستی می‌شود."]]],["درس سوم: تصمیم‌گیری چیست؟",[["تصمیم‌گیری یعنی چه؟","یعنی انتخاب یک راه از میان راه‌های مختلف."],["چرا باید در تصمیم‌گیری دقت کنیم؟","زیرا تصمیم‌های ما بر زندگی و آینده‌مان تأثیر می‌گذارند."],["تصمیم‌های انسان به چند دسته تقسیم می‌شوند؟", const SOC3=[["کشاورزی به چه عواملی وابسته است؟","به آب‌وهوا، خاک، آب و نیروی انسانی."],["مهم‌ترین عوامل طبیعی مؤثر در کشاورزی کدام‌اند؟","آب‌وهوا، خاک و آب."],["چرا کشاورزی در همه جای ایران یکسان نیست؟","چون شرایط آب‌وهوا، میزان بارندگی و نوع خاک در مناطق مختلف متفاوت است."],["دو نوع کشت را نام ببرید.","کشت آبی و کشت دیم."],["کشت آبی چیست؟","کشتی که برای آبیاری آن از آب رودخانه، چاه یا منابع دیگر استفاده می‌شود."],["کشت دیم چیست؟","کشتی که آب مورد نیاز آن بیشتر از باران تأمین می‌شود."],["محصولات کشاورزی به چند گروه تقسیم می‌شوند؟","به گروه‌هایی مانند غلات، حبوبات، محصولات جالیزی و محصولات باغی."],["چند نمونه از غلات را نام ببرید.","گندم، جو و برنج."],["چند نمونه از محصولات باغی را نام ببرید.","سیب، پرتقال، انگور و خرما."],["محصولات کشاورزی چگونه به دست مصرف‌کنندگان می‌رسند؟","پس از برداشت، بسته‌بندی و حمل‌ونقل به بازار و فروشگاه‌ها می‌رسند."],["چرا باید در مصرف محصولات کشاورزی صرفه‌جویی کنیم؟","چون برای تولید آن‌ها آب، خاک، زمان و نیروی انسانی زیادی مصرف می‌شود."],["چرا محصولات کشاورزی را بسته‌بندی می‌کنند؟","برای جلوگیری از خراب شدن و آسان‌تر شدن حمل‌ونقل و فروش."],["منظور از تولید تا مصرف چیست؟","مراحلی که محصول از زمان کاشت و برداشت تا رسیدن به دست مصرف‌کننده طی می‌کند."],["برای افزایش محصولات کشاورزی چه کارهایی می‌توان انجام داد؟","استفاده از روش‌های علمی، ماشین‌آلات مناسب و آبیاری درست."]];
function socialHTML(L){let n=0;return L.map(([t,qs])=>`<h2 class="sec">${t}</h2>`+qs.map(([q,a])=>`<div class="box qa"><b>${fa(++n)}. ${q}</b><p>${a.replace(/\n/g,"<br>")}</p></div>`).join("")).join("")}
function persianHTML(L){return L.map(([t,w],i)=>`<div class="box"><h2>${fa(i+1)}. ${t}</h2><div class="wl">${w.split("\n").map(l=>{const k=l.indexOf(":");return `<div><b>${l.slice(0,k)}</b><span>${l.slice(k+1).trim()}</span></div>`}).join("")}</div></div>`).join("")}
function scienceHTML(L){return L.map(([q,a],i)=>`<div class="box qa"><b>${fa(i+1)}. ${q}</b><p>${a.replace(/\n/g,"<br>")}</p></div>`).join("")}
function helpHTML(){return `<a class="lnk" href="https://mojtaba-75795.github.io/mojtababahrami/" target="_blank" rel="noopener noreferrer">رفع اشکال ریاضی</a><button class="lnk" data-day="help-science-1">رفع اشکال درس اول علوم</button><button class="lnk" data-day="help-science-2">رفع اشکال درس دوم علوم</button><button class="lnk" data-day="help-science-3">رفع اشکال درس سوم علوم</button><button class="lnk" data-day="help-persian-1">رفع اشکال فصل اول فارسی</button><button class="lnk" data-day="help-persian-2">رفع اشکال بخش اول فصل دوم فارسی</button><button class="lnk" data-day="help-social-1">رفع اشکال فصل اول مطالعات اجتماعی</button><button class="lnk" data-day="help-social-3">رفع اشکال فصل سوم مطالعات اجتماعی</button>`}
function show(id){
 let tab=id===DAY?"today":id.startsWith("help-")?"help":id;
 if(!TABS.some(t=>t[0]===tab)){id=tab=TABS[0][0];}
 document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===tab));
 document.getElementById("content").innerHTML=id==="today"?`<button class="day" data-day="${DAY}">۱۴۰۵/۸/۱۹</button>`:id===DAY?DAY_HTML:id==="students"?studentsHTML():id==="schedule"?scheduleHTML():id==="help"?helpHTML():id==="help-science-1"?scienceHTML(SCI):id==="help-science-2"?scienceHTML(SCI2):id==="help-science-3"?scienceHTML(SCI3):id==="help-persian-1"?persianHTML(PER1):id==="help-persian-2"?persianHTML(PER2):id==="help-social-1"?socialHTML(SOC):id==="help-social-3"?scienceHTML(SOC3):"";
 if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);
}
document.getElementById("content").onclick=e=>{const d=e.target.closest("[data-day]");if(d){show(d.dataset.day);return}const s=e.target.closest("[data-st]");if(s){const i=+s.dataset.st;abs=abs.includes(i)?abs.filter(x=>x!==i):[...abs,i];try{localStorage.setItem(KEY,JSON.stringify(abs))}catch(err){}show("students")}};
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.id)};
addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
